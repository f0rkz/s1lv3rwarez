name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgl1-mesa-dev pkg-config xauth xvfb xorg-dev

      - name: Test and build Linux project
        run: |
          xvfb-run -a go test ./...
          go build ./...

      - name: Build Windows release package
        run: ./scripts/build-windows.sh

      - name: Verify and checksum release files
        run: |
          file dist/S1LV3RWAREZ-WIN64/S1LV3RWAREZ.exe
          unzip -t dist/S1LV3RWAREZ-WIN64.zip
          (cd dist && sha256sum S1LV3RWAREZ-WIN64/S1LV3RWAREZ.exe S1LV3RWAREZ-WIN64.zip > SHA256SUMS.txt)

      - name: Prepare release notes
        run: |
          cat > dist/RELEASE_NOTES.txt <<'EOF'
          S1LV3RWAREZ - THE LOST CRACKTRO
          f0rkz + sp00nz | EST. 1998 / RECOVERED 2026

          Windows x64 GUI release. The ZIP includes the executable, README.NFO,
          and FILE_ID.DIZ. SHA256SUMS.txt provides checksums for the executable
          and ZIP package.

          This is a retrospective creative project, not an actual recovered
          historical executable. Cross-compilation was verified; Windows runtime
          behavior should be checked on a Windows x64 machine.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "S1LV3RWAREZ - THE LOST CRACKTRO $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.txt \
            dist/S1LV3RWAREZ-WIN64/S1LV3RWAREZ.exe \
            dist/S1LV3RWAREZ-WIN64.zip \
            dist/SHA256SUMS.txt
